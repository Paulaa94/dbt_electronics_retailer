models:
  - name: int_sales_enriched
    description: "Sales + unit prices + calc metrics (revenue, cost, profit)"
    columns:
      - name: revenue_usd
        tests: [not_null]
      - name: product_key
        tests: [not_null]

  - name: int_sales_daily
    description: "Aggr daily sales + revenue and profit summaries."
    columns:
      - name: order_date
        tests: [not_null, unique]

  - name: int_customers_enriched
    description: "Customer data enriched"
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_type
        tests:
            - accepted_values:
                values: ['One-time', 'Returning', 'No Orders']

  - name: int_brand_sales
    description: "Sales aggr by brand per day."
    columns:
      - name: brand
        tests: [not_null]
      - name: order_date
        tests: [not_null]
